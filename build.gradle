plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

base {
	archivesName = "lightweight-frameblend-output"
}

loom {
	accessWidenerPath = file("src/main/resources/frameblendoutput.accesswidener")
}

String getVersion() {
	String version = "${project.mod_version}"
	return version
}
version = getVersion()
group = project.maven_group

repositories {
	maven { url "https://maven.terraformersmc.com/"}
	maven { url "https://api.modrinth.com/maven"}
	maven { url 'https://jitpack.io' }
	flatDir {
		dirs 'libs'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
	testImplementation "junit:junit:4.13.2"
}

sourceSets {
	compatTest {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	}
}

def ringBufferCompatJar = tasks.register('ringBufferCompatJar', Jar) {
	archiveClassifier = 'compat-probe'
	destinationDirectory = layout.buildDirectory.dir('compat-test')
	from sourceSets.compatTest.output
}

tasks.register('verifyRingBufferCompatibility', JavaExec) {
	dependsOn tasks.named('jar'), ringBufferCompatJar
	classpath = files(tasks.named('jar').flatMap { it.archiveFile },
			ringBufferCompatJar.flatMap { it.archiveFile }) + configurations.runtimeClasspath
	mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
	systemProperty 'fabric.development', 'true'
	systemProperty 'java.awt.headless', 'true'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	doFirst {
		workingDir layout.buildDirectory.dir('compat-test').get().asFile
		workingDir.mkdirs()
	}
}
tasks.named('check') { dependsOn tasks.named('verifyRingBufferCompatibility') }

def generatedResources = layout.buildDirectory.dir('generated-resources')
sourceSets.main.resources.srcDir(generatedResources)
tasks.register('buildNative', Exec) {
	workingDir projectDir
	commandLine 'pwsh', '-NoProfile', '-File', file('native/build.ps1').absolutePath,
			'-OutputDirectory', generatedResources.get().dir('natives/win64').asFile.absolutePath
	inputs.files(fileTree('native') { exclude '.build/**' }, fileTree('ci'))
	outputs.dir(generatedResources)
}
processResources.dependsOn tasks.named('buildNative')
processResources.eachFile { details ->
	// Ignore obsolete checked-in binaries even in an incompletely updated clone.
	// Only buildNative's output is eligible for release packaging.
	if (details.file.toPath().startsWith(file('src/main/resources/natives/win64').toPath())) {
		details.exclude()
	}
}
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.register('releaseSources', Zip) {
	includeEmptyDirs = false
	archiveFileName = "${base.archivesName.get()}-${project.version}-source.zip"
	destinationDirectory = layout.buildDirectory.dir('distributions')
	from(projectDir) {
		include 'src/**', 'native/**', 'ci/**', '.github/**', 'gradle/**'
		include '.gitattributes', '.gitignore', 'build.gradle', 'settings.gradle', 'gradle.properties', 'gradlew', 'gradlew.bat', 'LICENSE', 'NOTICE', 'README.md', 'BUILDING.md'
		exclude 'native/.build/**', 'src/main/resources/natives/win64/*.dll'
		into 'lightweight-frameblend-output'
	}
}

test {
	useJUnit()
	systemProperty "fbo.verifyGpu", project.hasProperty("verifyRecordingGpu")
	systemProperty 'frameblendoutput.rgbaRolling', project.hasProperty('rgbaRolling')
	jvmArgs "--enable-native-access=ALL-UNNAMED"
	workingDir = projectDir
}

tasks.register('benchmarkRecordingShaders', JavaExec) {
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.frameblend.output.recording.RecordingShaderBenchmark'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	args file('src/main/resources/assets/frameblendoutput/shaders/post/frame_blending_direct.fsh').absolutePath,
			file('src/main/resources/assets/frameblendoutput/shaders/post/rolling_exposure.fsh').absolutePath
}

tasks.register('verifySpoutTransport', JavaExec) {
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.frameblend.output.recording.VulkanSpoutProbe'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	systemProperty 'frameblendoutput.synchronousSpout', project.hasProperty('synchronousSpout')
	systemProperty 'fbo.benchmarkVulkanRecording', project.hasProperty('benchmarkVulkanRecording')
	systemProperty 'frameblendoutput.rgbaRolling', project.hasProperty('rgbaRolling')
	workingDir = projectDir
	systemProperty 'frameblendoutput.copySpout', project.hasProperty('copySpout')
	systemProperty 'fbo.verifyDirectX', project.hasProperty('verifyDirectX')
	systemProperty 'fbo.directXOnly', project.hasProperty('directXOnly')
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
}

tasks.named('sourcesJar') {
	dependsOn tasks.named('buildNative')
	exclude 'natives/**'
}

jar {
	from("NOTICE")
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
